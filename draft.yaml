models:
  User:
    name: string
    email: string
    email_verified_at: datetime:nullable
    password: string
    remember_token: string:nullable
    two_factor_secret: text:nullable
    two_factor_recovery_codes: text:nullable
    two_factor_confirmed_at: datetime:nullable
    relationships:
      hasOne: Employee

  # ======================
  # UNIT
  # ======================
  OrganizationUnit:
    name: string
    code: string:unique:nullable
    parent_id: id:nullable
    type: enum:university,faculty,department,lab,unit
    description: text:nullable

    relationships:
      belongsTo: OrganizationUnit:parent_id
      hasMany: OrganizationUnit:parent_id, Employee

  # ======================
  # JABATAN STRUKTURAL
  # ======================

  StructuralPosition:
    name: string
    parent_id: id:nullable
    grade: string
    qualification: text:nullable
    description: text:nullable

    relationships:
      belongsTo: StructuralPosition:parent_id
      hasMany: StructuralPosition:parent_id, StructuralPositionHistory

  JobResponsibility:
    structural_position_id: id
    title: string
    description: text

    type: enum:main,function
    order: integer:nullable

    relationships:
      belongsTo: StructuralPosition

  StructuralPositionHistory:
    employee_id: id
    structural_position_id: id

    start_date: date
    end_date: date:nullable
    decree_number: string:nullable
    decree_date: date:nullable
    document: string:nullable

    relationships:
      belongsTo: Employee, StructuralPosition

  # ======================
  # PEGAWAI
  # ======================
  Employee:
    user_id: id:unique
    employee_number: string:unique
    national_id_number: string:nullable
    tax_id_number: string:nullable

    name: string
    birth_place: string
    birth_date: date
    gender: enum:male,female
    religion: string:nullable
    marital_status: enum:single,married,divorced

    address: text
    phone_number: string:nullable

    hire_date: date
    employment_status_id: id
    status: enum:active,inactive

    relationships:
      belongsTo: User, OrganizationUnit, EmploymentStatus
      hasOne: Lecturer, Staff
      hasMany: EducationHistory

  Lecturer:
    employee_id: id:unique
    academic_rank: string
    functional_position: string:nullable
    expertise: string:nullable
    relationships:
      belongsTo: Employee

  Staff:
    employee_id: id:unique
    position: string
    department: string
    relationships:
      belongsTo: Employee
      hasMany: StaffNomenclatureHistory

  EmploymentStatus:
    name: string
    description: string:nullable
    relationships:
      hasMany: Employee

  EducationHistory:
    employee_id: id
    degree: string
    institution: string
    major: string:nullable
    start_year: year
    end_year: year:nullable
    gpa: decimal:3,2:nullable
    relationships:
      belongsTo: Employee

  FunctionalPosition:
    name: string
    description: string:nullable
    level: integer:nullable

    relationships:
      hasMany: LecturerFunctionalPosition

  LecturerFunctionalPosition:
    lecturer_id: id
    functional_position_id: id
    start_date: date
    end_date: date:nullable
    decree_number: string:nullable
    decree_date: date:nullable
    sk_file: string:nullable

    relationships:
      belongsTo: Lecturer, FunctionalPosition

  # ======================
  # RESEARCH (PENELITIAN)
  # ======================

  Research:
    title: string
    description: text:nullable
    start_date: date
    end_date: date:nullable
    funding_source: string:nullable
    budget: decimal:12,2:nullable
    status: enum:proposed,ongoing,completed

    relationships:
      hasMany: ResearchMember, Publication

  ResearchMember:
    research_id: id
    lecturer_id: id
    role: string:nullable

    relationships:
      belongsTo: Research, Lecturer

  # ======================
  # COMMUNITY SERVICE (PENGABDIAN)
  # ======================

  CommunityService:
    title: string
    description: text:nullable
    location: string
    start_date: date
    end_date: date:nullable
    funding_source: string:nullable
    status: enum:proposed,ongoing,completed

    relationships:
      hasMany: CommunityServiceMember

  CommunityServiceMember:
    community_service_id: id
    lecturer_id: id
    role: string:nullable

    relationships:
      belongsTo: CommunityService, Lecturer

  # ======================
  # PUBLICATION
  # ======================
  Publication:
    title: string
    publication_date: date
    doi: string:nullable
    url: string:nullable
    abstract: text:nullable

    relationships:
      hasMany: PublicationAuthor
      hasOne: JournalPublication, ConferenceProceeding
      belongsTo: Research:nullable

  JournalPublication:
    publication_id: id:unique
    journal_name: string
    issn: string:nullable
    publisher: string:nullable
    volume: string:nullable
    issue: string:nullable
    pages: string:nullable

    indexing: string:nullable
    quartile: string:nullable

    relationships:
      belongsTo: Publication

  ConferenceProceeding:
    publication_id: id:unique
    conference_name: string
    conference_location: string:nullable
    conference_date: date:nullable

    publisher: string:nullable
    isbn: string:nullable
    pages: string:nullable

    indexing: string:nullable

    relationships:
      belongsTo: Publication

  PublicationAuthor:
    publication_id: id
    lecturer_id: id
    author_order: integer
    is_corresponding: boolean:default(false)

    relationships:
      belongsTo: Publication, Lecturer

  # ======================
  # MODUL KEHADIRAN
  # ======================
  Attendance:
    employee_id: id
    date: date
    check_in: datetime:nullable
    check_out: datetime:nullable

    status: enum:present,absent,leave,overtime,holiday
    notes: string:nullable

    relationships:
      belongsTo: Employee

  Holiday:
    date: date
    name: string

  # ======================
  # CUTI (LEAVE)
  # ======================
  LeaveType:
    name: string
    description: string:nullable
    default_quota: integer
    requires_attachment: boolean:default(false)

    relationships:
      hasMany: LeaveRequest, LeaveBalance

  LeaveBalance:
    employee_id: id
    leave_type_id: id
    year: year
    quota: integer
    used: integer:default(0)
    remaining: integer

    relationships:
      belongsTo: Employee, LeaveType

  LeaveRequest:
    employee_id: id
    leave_type_id: id

    start_date: date
    end_date: date
    total_days: integer

    reason: text:nullable
    attachment: string:nullable

    address_leave: string:nullable
    contact_leave: string:nullable

    status: enum:pending,approved,rejected,cancelled
    submitted_at: timestamp
    approved_at: timestamp:nullable

    approver_id: id:nullable

    relationships:
      belongsTo: Employee, LeaveType, Employee:approver_id
      hasMany: LeaveApprovalLog

  LeaveApproval:
    leave_request_id: id
    approver_id: id
    level: integer
    status: enum:pending,approved,rejected
    notes: text:nullable
    action_date: timestamp:nullable

    relationships:
      belongsTo: LeaveRequest, Employee:approver_id

  # ======================
  # LEMBUR (OVERTIME)
  # ======================
  OvertimeRequest:
    request_number: string:unique
    title: string
    description: text:nullable

    request_date: date
    planned_start_time: datetime
    planned_end_time: datetime

    status: enum:draft,pending,approved,rejected,completed,cancelled
    submitted_by: id
    approved_by: id:nullable

    submitted_at: timestamp:nullable
    approved_at: timestamp:nullable

    relationships:
      belongsTo: Employee:submitted_by, Employee:approved_by
      hasMany: OvertimeRequestMember, OvertimeApprovalLog, OvertimeReport

  OvertimeRequestMember:
    overtime_request_id: id
    employee_id: id

    role: string:nullable
    job_desc: string:nullable
    planned_hours: decimal:5,2

    actual_start_time: datetime
    actual_end_time: datetime
    actual_hours: decimal:5,2

    output: text:nullable
    attachment: string:nullable

    relationships:
      belongsTo: OvertimeRequest, Employee

  OvertimeApprovalLog:
    overtime_request_id: id
    approver_id: id
    status: enum:approved,rejected
    notes: text:nullable
    action_date: timestamp

    relationships:
      belongsTo: OvertimeRequest, Employee:approver_id
  # ======================
  # NOMENKLATUR PEKERJAAN
  # ======================

  Nomenclature:
    name: string
    qualification: text
    duties: text
    grade: string

    relationships:
      hasMany: NomenclatureClassification

  NomenclatureClassification:
    nomenclature_id: id
    name: string
    description: text:nullable

    relationships:
      belongsTo: Nomenclature
      hasMany: StaffNomenclatureHistory

  StaffNomenclatureHistory:
    staff_id: id
    nomenclature_classification_id: id

    start_date: date
    end_date: date:nullable
    decree_number: string:nullable
    decree_date: date:nullable
    document: string:nullable

    relationships:
      belongsTo: Staff, NomenclatureClassification

  # ======================
  # PERJALANAN DINAS
  # ======================
  OfficialTravel:
    request_number: string:unique

    purpose: string
    destination: string
    start_date: date
    end_date: date

    invitation_file: string:nullable

    status: enum:draft,pending,approved,rejected,completed
    submitted_by: id

    submitted_at: timestamp
    approved_at: timestamp:nullable
    approved_by: id:nullable

    travel_outcome: text:nullable
    outcome_followup: text:nullable

    relationships:
      belongsTo: Employee:submitted_by, Employee:approved_by
      hasMany: OfficialTravelMember, OfficialTravelItinerary, OfficialTravelApproval, OfficialTravelReport, TravelExpense, OfficialTravelDocument

  OfficialTravelMember:
    official_travel_id: id
    employee_id: id
    report_date: date
    summary: text
    attachment: string:nullable

    role: string:nullable

    relationships:
      belongsTo: OfficialTravel, Employee

  OfficialTravelItinerary:
    official_travel_id: id

    date: date
    location: string
    activity: string
    description: text:nullable

    relationships:
      belongsTo: OfficialTravel

  OfficialTravelApproval:
    official_travel_id: id
    approver_id: id

    status: enum:approved,rejected
    notes: text:nullable
    action_date: timestamp

    relationships:
      belongsTo: OfficialTravel, Employee:approver_id

  TravelCostComponent:
    name: string
    code: string:unique
    description: text:nullable

    relationships:
      hasMany: TravelExpense, TravelCostStandard

  TravelCostStandard:
    city_id: id
    structural_position_id: id:nullable
    employee_grade_id: id:nullable
    travel_cost_component_id: id

    amount: decimal:12,2

    relationships:
      belongsTo: City, StructuralPosition, EmployeeGrade, TravelCostComponent

  TravelExpense:
    official_travel_id: id
    employee_id: id

    travel_cost_component_id: id
    amount: decimal:12,2
    description: text:nullable
    receipt_file: string:nullable

    submitted_at: timestamp
    verified_at: timestamp:nullable

    status: enum:submitted,approved,rejected

    relationships:
      belongsTo: OfficialTravel, Employee

  OfficialTravelDocument:
    official_travel_id: id

    title: string
    file_path: string
    file_type: string:nullable
    uploaded_at: timestamp

    relationships:
      belongsTo: OfficialTravel

